<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Danyal Zahid — DevOps Engineer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d1117;
    color: #e6edf3;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .card {
    background: #161b22;
    border: 1px solid #21262d;
    border-radius: 16px;
    padding: 3rem 2.5rem;
    text-align: center;
    max-width: 420px;
  }
  .avatar {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: linear-gradient(135deg, #1f5c99, #1e9e75);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 600;
    color: #fff;
    margin: 0 auto 1.25rem;
  }
  h1 { font-size: 24px; margin-bottom: 6px; }
  p.tagline { color: #8b949e; font-size: 14px; margin-bottom: 1.5rem; }
  .badge {
    display: inline-block;
    background: #1f2937;
    color: #7fb7eb;
    font-size: 12px;
    padding: 4px 12px;
    border-radius: 6px;
    margin: 3px;
  }
  .footer {
    margin-top: 1.75rem;
    font-size: 11px;
    color: #5f6570;
    border-top: 1px solid #21262d;
    padding-top: 1rem;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="avatar">DZ</div>
    <h1>Danyal Zahid</h1>
    <p class="tagline">Azure DevOps Engineer &middot; IaC and Automation</p>
    <span class="badge">Terraform</span>
    <span class="badge">Ansible</span>
    <span class="badge">Docker</span>
    <span class="badge">Kubernetes</span>
    <span class="badge">Azure</span>
    <div class="footer">Static site &middot; hosted directly on IIS</div>
  </div>
</body>
</html>
